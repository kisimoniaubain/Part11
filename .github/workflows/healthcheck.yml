name: Periodic Health Check

on:
  schedule:
    # Runs every 24 hours (00:00 UTC) to conserve build minutes
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  periodic_health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: joshdk/url-health-check@v1
        with:
          url: 'https://your-app-name.onrender.com'
          max-attempts: 3
          retry-delay: 5s